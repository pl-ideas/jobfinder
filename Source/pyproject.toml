[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfinder"
version = "0.1.0"
description = "Find and filter job postings from known sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobfinder = "jobfinder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobfinder*"]
